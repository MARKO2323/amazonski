<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>amazonski.rs</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji" rel="stylesheet">
</head>
<body>

  <!-- Floating Presenter Video -->
  <div class="floating-video">
    <video id="presenterVideo" src="video/welcome.mp4" autoplay muted loop playsinline></video>
    <button onclick="unmuteVideo()" class="unmute-btn">🔊 Uključi zvuk</button>
  </div>

  <!-- Header -->
  <div class="header-bar">
    <div class="logo-container">
      <img src="images/amazon.png" alt="Amazonski Logo" class="logo-glossy">
    </div>
    <div class="header-icons">
      <!-- Viber ikonica sa brojem -->
      <div class="viber-display">
        <img src="images/viber.png" alt="Viber" class="viber-icon">
        <span class="viber-phone">060/3806978</span>
      </div>
      <div class="social-icons">
        <a href="https://www.youtube.com/@ZeitgeisTVchanel" target="_blank">
          <img src="images/yt - Copy.png" alt="YouTube" class="social-icon">
        </a>
        <a href="https://x.com/qudeka" target="_blank">
          <img src="images/twiter - Copy.png" alt="Twitter" class="social-icon">
        </a>
        <a href="https://www.kupujemprodajem.com/moj-kp/moji-oglasi" target="_blank">
          <img src="images/kp-icon.png" alt="KP" class="social-icon">
        </a>
      </div>
    </div>
  </div>

  <!-- Filter Input -->
  <div class="filter-section">
    <input type="text" id="filterInput" placeholder="Pretraži proizvode...">
  </div>

  <!-- Product Grid -->
  <div class="grid" id="proizvodi"></div>

  <!-- Popup za detalje -->
  <div id="detaljiPopup" class="popup-overlay" onclick="zatvoriDetalje()">
    <div class="popup-content" onclick="event.stopPropagation()"></div>
  </div>

  <!-- Zvuk klik -->
  <audio id="klikZvuk" src="klik.mp3" preload="auto"></audio>

  <!-- Footer -->
  <footer>
    <p>© amazonski.rs | Kontakt: 060/3806978</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
